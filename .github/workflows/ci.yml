name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teamflow
      AUTH_SECRET: ci-only-auth-secret-not-for-production-123456
      ENCRYPTION_KEY: ci-only-encryption-key-not-for-production-123456
      ENCRYPTION_HMAC_KEY: ci-only-hmac-key-not-for-production-123456
      NEXT_PUBLIC_APP_URL: https://example.invalid
      PUBLIC_APP_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
